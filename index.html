<!DOCTYPE html>
<html lang="bg">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Меню с жълто поле за категории и сектори алкохол</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #fff;
    color: #222;
    display: flex;
    min-height: 100vh;
  }
  .sidebar {
    width: 100px;
    background-color: #f9d235;
    display: flex;
    flex-direction: column;
    padding-top: 30px;
    box-sizing: border-box;
    border-right: 2px solid #d2b918;
  }
  .category-btn {
    font-size: 0.75rem;
    font-weight: 600;
    color: #333;
    text-align: center;
    padding: 10px 5px;
    cursor: pointer;
    border-left: 4px solid transparent;
    margin-bottom: 12px;
    user-select: none;
    transition: all 0.3s ease;
  }
  .category-btn:hover {
    background-color: #e5c735;
  }
  .category-btn.active {
    border-left-color: #333;
    background-color: #d6c62f;
    font-weight: 700;
    color: #111;
  }
  .content {
    flex-grow: 1;
    padding: 30px 25px;
    overflow-y: auto;
  }
  h1 {
    font-family: 'Georgia', serif;
    font-size: 2rem;
    margin-top: 0;
    margin-bottom: 25px;
    color: #222;
    text-align: center;
  }
  h2 {
    font-family: 'Georgia', serif;
    font-size: 1.6rem;
    color: #333;
    border-bottom: 2px solid #bbb;
    padding-bottom: 6px;
    margin-top: 40px;
    margin-bottom: 15px;
  }
  .sector {
    margin-bottom: 30px;
  }
  .dish {
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .dish-name {
    font-weight: bold;
    font-size: 1.1rem;
    max-width: 75%;
    word-wrap: break-word;
  }
  .dish-price {
    font-weight: 600;
    color: #555;
    font-size: 1rem;
    white-space: nowrap;
  }
  .dish-desc {
    font-style: italic;
    font-size: 0.9rem;
    color: #555;
    margin-top: 3px;
    max-width: 100%;
    clear: both;
  }
  @media (max-width: 600px) {
    body {
      flex-direction: column;
    }
    .sidebar {
      width: 100%;
      height: auto;
      flex-direction: row;
      justify-content: center;
      padding: 10px 0;
      border-right: none;
      border-bottom: 2px solid #d2b918;
    }
    .category-btn {
      margin: 0 8px;
      padding: 8px 6px;
      font-size: 0.85rem;
      border-left: none;
      border-bottom: 3px solid transparent;
    }
    .category-btn.active {
      border-left: none;
      border-bottom-color: #333;
      background-color: #f8ea87;
    }
    .content {
      padding: 20px 15px;
    }
    .dish {
      flex-direction: column;
      align-items: flex-start;
    }
    .dish-price {
      margin-top: 5px;
    }
  }
</style>
</head>

<body>
  <div class="sidebar" id="categories"></div>
  <div class="content">
    <h1>Меню на ресторант</h1>
    <h2 id="categoryTitle"></h2>
    <div id="dishesList"></div>
  </div>

  <script>
    const menuData = {
      "Студени напитки": [
        {title: "Минерална вода - 500 мл", description: "", price: "0.50 лв.", logo: "https://i.imgur.com/5jzS8sb.png"},
        {title: "Минерална вода - 1.50 л", description: "", price: "1.20 лв."},
        {title: "Кола - 250 мл", description: "", price: "1.50 лв."},
        {title: "Фанта - 250 мл", description: "", price: "1.50 лв."},
        {title: "Сода - 250 мл", description: "", price: "1.00 лв."},
        {title: "Спрайт - 250 мл", description: "", price: "1.50 лв."},
        {title: "Швепс тоник - 250 мл", description: "", price: "1.50 лв."},
        {title: "Капи - 250 мл", description: "", price: "1.50 лв."},
        {title: "Студен чай - 500 мл", description: "", price: "1.50 лв."}
      ],
      "Топли напитки": [
        {title: "Кафе еспресо", description: "", price: "0.60 лв."},
        {title: "Чай", description: "", price: "0.60 лв."},
        {title: "3в1", description: "", price: "0.60 лв."},
        {title: "Фрапе", description: "", price: "1.50 лв."},
        {title: "Горещ шоколад", description: "", price: ""},
        {title: "Мед", description: "", price: ""},
        {title: "Сметана", description: "", price: "0.10 лв."},
        {title: "Каничка мляко", description: "", price: "0.30 лв."}
      ],
      "Алкохолни напитки": {
        "Ракии": [
          {title: "Домашна ракия", description: "", price: ""},
          {title: "Ракия Бургас 63", description: "", price: ""},
          {title: "Ракия Сунгурларска гроздова", description: "", price: ""},
          {title: "Ракия Сливенска перла", description: "", price: ""}
        ],
        "Уискита": [
          {title: "Джак Даниелс (Jack Daniels)", description: "", price: ""},
          {title: "Джони Уокър (Johnnie Walker Red label)", description: "", price: ""},
          {title: "Джеймисън (Jameson)", description: "", price: ""},
          {title: "Джей енд Би (J&B)", description: "", price: ""},
          {title: "Джим Бийм (Jim beam)", description: "", price: ""},
          {title: "Феймъс граус (famous grouse)", description: "", price: ""},
          {title: "Tullamore D.E.W.", description: "", price: ""}
        ],
        "Водки": [
          {title: "Руски Стандарт (Russian Standard)", description: "", price: ""},
          {title: "Смирноф (Smirnoff)", description: "", price: ""},
          {title: "Житна (ZYTNIA)", description: "", price: ""},
          {title: "Зубровка (Żubrówka)", description: "", price: ""}
        ],
        "Вина": [
          {title: "Домашно вино", description: "", price: ""}
        ],
        "УЗО": [
          {title: "УЗО", description: "", price: ""},
          {title: "УЗО МЕЛТЕМИ (OUZO MELTEMI)", description: "", price: ""},
          {title: "Узо Пломари (Ouzo of Plomari)", description: "", price: ""},
          {title: "УЗО 12 (OUZO 12)", description: "", price: ""}
        ]
      },
      "Предястия": [
        {title: "Карпачо", description: "Свежо нарязано говеждо месо със зехтин и пармезан", price: "12 лв."},
        {title: "Салата Цезар", description: "Салата с маруля, пиле, пармезан и дресинг", price: "10 лв."}
      ],
      "Основни ястия": [
        {title: "Пиле с гарнитура", description: "Печено пиле със сезонни зеленчуци и картофи", price: "15 лв."},
        {title: "Спагети Болонезе", description: "Домашни спагети с месен сос болонезе", price: "13 лв."}
      ],
      "Десерти": [
        {title: "Тирамису", description: "Класически десерт с кафе и маскарпоне", price: "7 лв."},
        {title: "Чийзкейк", description: "Плодов чийзкейк с бисквитена основа", price: "8 лв."}
      ]
    };

    const categoriesDiv = document.getElementById('categories');
    const dishesListDiv = document.getElementById('dishesList');
    const categoryTitleDiv = document.getElementById('categoryTitle');

    function loadCategories() {
      for (const category in menuData) {
        const btn = document.createElement('button');
        btn.textContent = category;
        btn.className = 'category-btn';
        btn.onclick = () => selectCategory(category, btn);
        categoriesDiv.appendChild(btn);
      }
      const firstCategory = Object.keys(menuData)[0];
      const firstBtn = categoriesDiv.querySelector('button');
      selectCategory(firstCategory, firstBtn);
    }

    function selectCategory(category, btn) {
      categoryTitleDiv.textContent = category;
      updateActiveCategory(btn);
      loadDishes(category);
    }

    function loadDishes(category) {
      dishesListDiv.innerHTML = '';
      let items = menuData[category];
      if (category === "Алкохолни напитки") {
        for (const sector in items) {
          const sectorDiv = document.createElement('div');
          sectorDiv.className = 'sector';
          const sectorTitle = document.createElement('h2');
          sectorTitle.textContent = sector;
          sectorDiv.appendChild(sectorTitle);

          items[sector].forEach(dish => {
            const dishDiv = document.createElement('div');
            dishDiv.className = 'dish';

            const nameSpan = document.createElement('span');
            nameSpan.className = 'dish-name';
            nameSpan.textContent = dish.title;

            const priceSpan = document.createElement('span');
            priceSpan.className = 'dish-price';
            if (dish.price && dish.price.trim() !== "") priceSpan.textContent = dish.price;

            dishDiv.appendChild(nameSpan);
            dishDiv.appendChild(priceSpan);

            if (dish.description && dish.description.trim() !== "") {
              const descDiv = document.createElement('div');
              descDiv.className = 'dish-desc';
              descDiv.textContent = dish.description;
              dishDiv.appendChild(descDiv);
            }

            sectorDiv.appendChild(dishDiv);
          });

          dishesListDiv.appendChild(sectorDiv);
        }
      } else {
        items.forEach(dish => {
          const dishDiv = document.createElement('div');
          dishDiv.className = 'dish';

          const nameSpan = document.createElement('span');
          nameSpan.className = 'dish-name';
          nameSpan.textContent = dish.title;

          const priceSpan = document.createElement('span');
          priceSpan.className = 'dish-price';
          if (dish.price && dish.price.trim() !== "") priceSpan.textContent = dish.price;

          dishDiv.appendChild(nameSpan);
          dishDiv.appendChild(priceSpan);

          if (dish.description && dish.description.trim() !== "") {
            const descDiv = document.createElement('div');
            descDiv.className = 'dish-desc';
            descDiv.textContent = dish.description;
            dishDiv.appendChild(descDiv);
          }

          dishesListDiv.appendChild(dishDiv);
        });
      }
    }

    function updateActiveCategory(activeBtn) {
      const buttons = categoriesDiv.querySelectorAll('button');
      buttons.forEach(btn => {
        btn.classList.remove('active');
      });
      activeBtn.classList.add('active');
    }

    loadCategories();
  </script>
</body>

</html>
