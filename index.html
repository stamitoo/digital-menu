<!DOCTYPE html>
<html lang="bg">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ресторант "Елеганс" – Адаптивно Меню</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Roboto&display=swap" rel="stylesheet" />
  <style>
    /* Основни стилове */
    body {
      margin: 0;
      background-color: #fff;
      color: #222;
      font-family: 'Roboto', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 10px;
    }

    .container {
      display: flex;
      max-width: 1100px;
      width: 100%;
      background: #fefefe;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      flex-direction: row-reverse;
      min-height: 500px;
      border: 1px solid #ddd;
    }

    /* Дясна част - меню */

    .right-panel {
      flex: 1.4;
      background-color: #fafafa;
      padding: 25px 20px;
      overflow-y: auto;
      border-left: 2px solid #ccc;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      font-family: 'Playfair Display', serif;
    }

    header h1 {
      font-size: 2.2rem;
      color: #111;
      margin: 0;
      letter-spacing: 2px;
      user-select: none;
    }

    header p {
      color: #666;
      font-style: italic;
      margin-top: 4px;
      user-select: none;
    }

    /* Меню с категории - хоризонтално за мобилни и вертикално за десктоп */

    .categories {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e0e0e0;
    }

    .category-button {
      flex: 0 0 auto;
      background: none;
      border: none;
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: #555;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 8px;
      transition: all 0.25s ease;
      user-select: none;
      border: 1px solid transparent;
    }

    .category-button:hover {
      background-color: #eee;
      color: #222;
    }

    .category-button.active {
      background-color: #222;
      color: #fff;
      border-color: #222;
    }

    /* Списък с ястия */

    .dishes-list {
      flex-grow: 1;
      overflow-y: auto;
    }

    .dish-item {
      font-size: 1rem;
      padding: 10px 12px;
      cursor: pointer;
      border-radius: 8px;
      color: #444;
      border: 1px solid transparent;
      margin-bottom: 10px;
      transition: background-color 0.3s, color 0.3s, border-color 0.3s;
      user-select: none;
    }

    .dish-item:hover {
      background-color: #222;
      color: #fff;
      border-color: #222;
    }

    .dish-item.active {
      background-color: #111;
      color: #fff;
      border-color: #111;
      font-weight: 600;
    }

    /* Лява част - изображение и описание */

    .left-panel {
      flex: 2;
      background-color: #fff;
      padding: 35px 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-sizing: border-box;
    }

    .left-panel img {
      width: 100%;
      border-radius: 14px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05);
      max-height: 400px;
      object-fit: cover;
      margin-bottom: 26px;
    }

    .left-panel h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.6rem;
      color: #111;
      margin-bottom: 14px;
      letter-spacing: 2px;
    }

    .left-panel p.description {
      font-size: 1.1rem;
      line-height: 1.5;
      color: #555;
      margin-bottom: 22px;
      max-width: 95%;
    }

    .left-panel .ingredients {
      font-style: italic;
      color: #888;
      margin-bottom: 22px;
      font-size: 0.94rem;
    }

    .left-panel .price {
      font-weight: 700;
      font-size: 1.9rem;
      color: #111;
      letter-spacing: 2px;
    }

    /* Скролове */

    .right-panel::-webkit-scrollbar {
      width: 8px;
    }

    .right-panel::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 6px;
    }

    .dishes-list::-webkit-scrollbar {
      width: 6px;
    }

    .dishes-list::-webkit-scrollbar-thumb {
      background: #bbb;
      border-radius: 3px;
    }

    /* Адаптивност */

    @media (max-width: 900px) {
      .container {
        flex-direction: column;
        min-height: auto;
      }

      .left-panel {
        padding: 20px 15px;
        max-height: none;
      }

      .left-panel img {
        max-height: 260px;
        margin-bottom: 20px;
        border-radius: 12px;
      }

      .left-panel h2 {
        font-size: 2rem;
      }

      .left-panel p.description,
      .left-panel .ingredients {
        font-size: 1rem;
      }

      .left-panel .price {
        font-size: 1.7rem;
      }

      .right-panel {
        flex: none;
        padding: 15px 15px 25px;
        border-left: none;
        border-top: 1px solid #ddd;
        max-height: 320px;
        overflow-y: visible;
      }

      header {
        margin-bottom: 15px;
      }

      .categories {
        margin-bottom: 8px;
        border-bottom: none;
      }

      .category-button {
        font-size: 1rem;
        padding: 8px 14px;
        border-radius: 12px;
      }

      .category-button.active {
        border-radius: 12px;
      }

      .dishes-list {
        max-height: none;
        margin-top: 0;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="left-panel" id="leftPanel">
      <img id="dishImage" src="https://images.unsplash.com/photo-1604909053142-0c7af30f93a5?auto=format&fit=crop&w=700&q=80" alt="Ястие">
      <h2 id="dishTitle">Филе миньон с трюфелов сос</h2>
      <p class="description" id="dishDescription">Кадифено филе миньон, сервирано със сос от бели трюфели, гарнирано с пресни зеленчуци и домашно приготвено картофено пюре.</p>
      <p class="ingredients" id="dishIngredients">Съставки: говеждо месо, трюфели, сметана, подправки</p>
      <p class="price" id="dishPrice">58 лв.</p>
    </div>

    <div class="right-panel">
      <header>
        <h1>Ресторант "Елеганс"</h1>
        <p>Изискано дигитално меню</p>
      </header>

      <nav class="categories" id="categoriesNav"></nav>

      <div class="dishes-list" id="dishesList"></div>
    </div>
  </div>

  <script>
    const menuData = {
      "Предястия": [
        {
          title: "Карпачо от говеждо",
          description: "Фино нарязано прясно говеждо месо с каперси, рукола и пармезан.",
          ingredients: "говеждо месо, каперси, рукола, пармезан",
          price: "28 лв.",
          image: "https://images.unsplash.com/photo-1556912994-3c0115aa0746?auto=format&fit=crop&w=700&q=80"
        },
        {
          title: "Салата Рукола с пармезан",
          description: "Свежа салата с рукола, пармезан, чери домати и зехтин.",
          ingredients: "рукола, пармезан, чери домати, зехтин",
          price: "24 лв.",
          image: "https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=700&q=80"
        }
      ],
      "Основни ястия": [
        {
          title: "Филе миньон с трюфелов сос",
          description: "Кадифено филе миньон, сервирано със сос от бели трюфели, гарнирано с пресни зеленчуци и домашно приготвено картофено пюре.",
          ingredients: "говеждо месо, трюфели, сметана, подправки",
          price: "58 лв.",
          image: "https://images.unsplash.com/photo-1604909053142-0c7af30f93a5?auto=format&fit=crop&w=700&q=80"
        },
        {
          title: "Лосос на скара с аспержи",
          description: "Прясно изпечен лосос, поднесен с печени аспержи и лимонов сос.",
          ingredients: "лосос, аспержи, лимон, подправки",
          price: "52 лв.",
          image: "https://images.unsplash.com/photo-1525755662778-989d0524087e?auto=format&fit=crop&w=700&q=80"
        }
      ],
      "Десерти": [
        {
          title: "Шоколадово суфле с ванилов крем",
          description: "Топло шоколадово суфле, поднесено с лек ванилов крем и пресни плодове.",
          ingredients: "шоколад, ванилия, яйца, брашно",
          price: "18 лв.",
          image: "https://images.unsplash.com/photo-1562440499-176fed524888?auto=format&fit=crop&w=700&q=80"
        },
        {
          title: "Мус от манго и маракуя",
          description: "Лек и освежаващ мус с манго и маракуя, украсен с листа мента.",
          ingredients: "манго, маракуя, сметана, захар",
          price: "16 лв.",
          image: "https://images.unsplash.com/photo-1563805042-7684d5e29fff?auto=format&fit=crop&w=700&q=80"
        }
      ],
      "Напитки": [
        {
          title: "Червено вино Каберне",
          description: "Богато и плътно червено вино с аромат на тъмни плодове.",
          ingredients: "каберне совиньон",
          price: "14 лв.",
          image: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=700&q=80"
        },
        {
          title: "Шампанско брют",
          description: "Елегантно и свежо шампанско с балансирана киселинност.",
          ingredients: "шампанско, грозде",
          price: "22 лв.",
          image: "https://images.unsplash.com/photo-1617191512881-5e704a81c38b?auto=format&fit=crop&w=700&q=80"
        },
        {
          title: "Еспресо",
          description: "Силно и ароматно кафе, приготвено с фина техника.",
          ingredients: "кафе",
          price: "5 лв.",
          image: "https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=700&q=80"
        }
      ]
    };

    const categoriesNav = document.getElementById('categoriesNav');
    const dishesList = document.getElementById('dishesList');
    const dishImage = document.getElementById('dishImage');
    const dishTitle = document.getElementById('dishTitle');
    const dishDescription = document.getElementById('dishDescription');
    const dishIngredients = document.getElementById('dishIngredients');
    const dishPrice = document.getElementById('dishPrice');

    let currentCategory = null;
    let currentDishIndex = 0;

    function loadCategories() {
      for (const category in menuData) {
        const btn = document.createElement('button');
        btn.textContent = category;
        btn.classList.add('category-button');
        btn.onclick = () => selectCategory(category);
        categoriesNav.appendChild(btn);
      }
      const firstCategory = Object.keys(menuData)[0];
      selectCategory(firstCategory);
    }

    function selectCategory(category) {
      currentCategory = category;
      currentDishIndex = 0;
      updateCategoryButtons();
      loadDishes();
      showDish(currentDishIndex);
    }

    function updateCategoryButtons() {
      [...categoriesNav.children].forEach(btn => {
        btn.classList.toggle('active', btn.textContent === currentCategory);
      });
    }

    function loadDishes() {
      dishesList.innerHTML = '';
      menuData[currentCategory].forEach((dish, index) => {
        const div = document.createElement('div');
        div.classList.add('dish-item');
        div.textContent = dish.title;
        div.onclick = () => {
          currentDishIndex = index;
          showDish(currentDishIndex);
          updateDishActive();
        };
        dishesList.appendChild(div);
      });
      updateDishActive();
    }

    function updateDishActive() {
      [...dishesList.children].forEach((el, idx) => {
        el.classList.toggle('active', idx === currentDishIndex);
      });
    }

    function showDish(index) {
      const dish = menuData[currentCategory][index];
      dishImage.src = dish.image;
      dishTitle.textContent = dish.title;
      dishDescription.textContent = dish.description;
      dishIngredients.textContent = `Съставки: ${dish.ingredients}`;
      dishPrice.textContent = dish.price;
    }

    loadCategories();
  </script>
</body>

</html>
