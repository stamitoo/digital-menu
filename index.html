<!DOCTYPE html>
<html lang="bg">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Меню с жълто поле за категории</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #fff;
      color: #222;
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 100px;
      background-color: #f9d235;
      display: flex;
      flex-direction: column;
      padding-top: 30px;
      box-sizing: border-box;
      border-right: 2px solid #d2b918;
    }

    .category-btn {
      font-size: 0.75rem;
      font-weight: 600;
      color: #333;
      text-align: center;
      padding: 10px 5px;
      cursor: pointer;
      border-left: 4px solid transparent;
      margin-bottom: 12px;
      user-select: none;
      transition: all 0.3s ease;
    }

    .category-btn:hover {
      background-color: #e5c735;
    }

    .category-btn.active {
      border-left-color: #333;
      background-color: #d6c62f;
      font-weight: 700;
      color: #111;
    }

    .content {
      flex-grow: 1;
      padding: 30px 25px;
      overflow-y: auto;
    }

    h1 {
      font-family: 'Georgia', serif;
      font-size: 2rem;
      margin-top: 0;
      margin-bottom: 25px;
      color: #222;
      text-align: center;
    }

    h2 {
      font-family: 'Georgia', serif;
      font-size: 1.6rem;
      margin-bottom: 15px;
      color: #333;
      border-bottom: 1px solid #ddd;
      padding-bottom: 6px;
    }

    .dish {
      margin-bottom: 20px;
    }

    .dish-name {
      font-weight: bold;
      font-size: 1.15rem;
      display: block;
      margin-bottom: 4px;
    }

    .dish-desc {
      font-style: italic;
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 5px;
    }

    .dish-price {
      font-weight: 600;
      color: #777;
      text-align: right;
      font-size: 1rem;
    }

    /* За малки екрани правим колони вертикални */
    @media (max-width: 600px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: auto;
        flex-direction: row;
        justify-content: center;
        padding: 10px 0;
        border-right: none;
        border-bottom: 2px solid #d2b918;
      }

      .category-btn {
        margin: 0 8px;
        padding: 8px 6px;
        font-size: 0.85rem;
        border-left: none;
        border-bottom: 3px solid transparent;
      }

      .category-btn.active {
        border-left: none;
        border-bottom-color: #333;
        background-color: #f8ea87;
      }

      .content {
        padding: 20px 15px;
      }
    }
  </style>
</head>

<body>
  <div class="sidebar" id="categories">
    <!-- Категории ще се заредят тук -->
  </div>

  <div class="content">
    <h1>Меню на ресторант</h1>
    <div id="categoryTitle" style="font-family: Georgia, serif; font-size:1.6rem; margin-bottom: 20px; color:#444;"></div>
    <div id="dishesList"></div>
  </div>

  <script>
    const menuData = {
      "Напитки": [
        {
          title: "Минерална вода",
          description: "500 мл",
          price: "2 лв."
        },
        {
          title: "Безалкохолна напитка",
          description: "Асортимент от газирани напитки",
          price: "3 лв."
        },
        {
          title: "Кафе еспресо",
          description: "",
          price: "2.5 лв."
        }
      ],

      "Предястия": [
        {
          title: "Карпачо",
          description: "Свежо нарязано говеждо месо със зехтин и пармезан",
          price: "12 лв."
        },
        {
          title: "Салата Цезар",
          description: "Салата с маруля, пиле, пармезан и дресинг",
          price: "10 лв."
        }
      ],

      "Основни ястия": [
        {
          title: "Пиле с гарнитура",
          description: "Печено пиле със сезонни зеленчуци и картофи",
          price: "15 лв."
        },
        {
          title: "Спагети Болонезе",
          description: "Домашни спагети с месен сос болонезе",
          price: "13 лв."
        }
      ],

      "Десерти": [
        {
          title: "Тирамису",
          description: "Класически десерт с кафе и маскарпоне",
          price: "7 лв."
        },
        {
          title: "Чийзкейк",
          description: "Плодов чийзкейк с бисквитена основа",
          price: "8 лв."
        }
      ]
    };

    const categoriesDiv = document.getElementById('categories');
    const dishesListDiv = document.getElementById('dishesList');
    const categoryTitleDiv = document.getElementById('categoryTitle');

    let currentCategory = null;

    function loadCategories() {
      for (const category in menuData) {
        const btn = document.createElement('button');
        btn.textContent = category;
        btn.className = 'category-btn';
        btn.onclick = () => selectCategory(category, btn);
        categoriesDiv.appendChild(btn);
      }
      // Взимаме първата категория по подразбиране
      const firstCategory = Object.keys(menuData)[0];
      const firstBtn = categoriesDiv.querySelector('button');
      selectCategory(firstCategory, firstBtn);
    }

    function selectCategory(category, btn) {
      currentCategory = category;
      categoryTitleDiv.textContent = category;
      loadDishes(category);
      updateActiveCategory(btn);
    }

    function loadDishes(category) {
      dishesListDiv.innerHTML = '';
      menuData[category].forEach(dish => {
        const dishDiv = document.createElement('div');
        dishDiv.className = 'dish';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'dish-name';
        nameSpan.textContent = dish.title;

        const priceSpan = document.createElement('span');
        priceSpan.className = 'dish-price';
        priceSpan.textContent = dish.price;

        const descDiv = document.createElement('div');
        descDiv.className = 'dish-desc';
        descDiv.textContent = dish.description;

        dishDiv.appendChild(nameSpan);
        dishDiv.appendChild(priceSpan);
        dishDiv.appendChild(descDiv);

        dishesListDiv.appendChild(dishDiv);
      });
    }

    function updateActiveCategory(activeBtn) {
      const buttons = categoriesDiv.querySelectorAll('button');
      buttons.forEach(btn => {
        btn.classList.remove('active');
      });
      activeBtn.classList.add('active');
    }

    loadCategories();

  </script>
</body>

</html>
